{{ with .Site.Data.team }}
  {{ if .enable }}
  <section class="site-team">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="section-title">
            <h2>
              {{ .title }}
            </h2>
          </div>
        </div>
        {{ range .members }}
        <div class="col-lg-4 col-md-6">
          <div class="site-team-member">
            <div class="site-team-member-image">
              <a href="{{ .ncarpage | absURL }}"><img src="{{ .image | absURL }}" alt="team-member"></a>
            </div>
            <div class="site-team-member-content">
              <h3>{{ .name }}</h3>
              <p>{{ .designation }}</p>
              <ul class="site-team-member-social">
                <li><a href="{{ .github | absURL }}"><i class="fa fa-github" style="font-size:1.6em;"></i></a></li>
                {{ if .orcid }}
                <li>
                <a href="{{ .orcid | absURL }}">
                  <img src="/images/ORCID-iD_icon_vector-small.png" alt="ORCID iD" style="height:1.9em;vertical-align:middle; padding-bottom:0.5em;">
                </a>
                </li>
                {{ end }}
              </ul>
            </div>
          </div>
        </div>
        {{ end }}
      </div>
    </div>
  </section>
  {{ end }}
{{ end }}
