{{ define "main" }}

<section class="site-tutorials-header" style="background-image: url('/images/banners/turtle.webp');">
<div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12 text-center">
        <h1>{{ .Title }}</h1>
      </div>
    </div>
  </div>
</section>

<section class="site-tutorials-content">
  <div class="container">
    <div class="row">
      {{ range .Site.Data.videos.videos }}
      <div class="col-lg-6 mb-4">
        <div class="card h-100 border-0">
          <div class="card-body text-center">
            <h4>{{ .title }}</h4>
            <div class="embed-responsive embed-responsive-16by9 mb-2">
              <iframe class="embed-responsive-item" width="100%" height="315"
                src="https://www.youtube.com/embed/{{ .youtube_id }}"
                frameborder="0" allowfullscreen></iframe>
            </div>
            <p>{{ .description }}</p>
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>

{{ end }}
